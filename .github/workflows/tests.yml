name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    name: Run All Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run unit tests
        run: npm run test:unit:coverage

      - name: Run integration tests
        run: npm run test:integration:coverage
        env:
          API_URL: http://localhost:8000

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000

      - name: Generate coverage reports
        if: always()
        run: npm run coverage:jest

      - name: Upload Jest coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20.x'
        with:
          file: ./coverage/jest/lcov.info
          flags: jest
          name: jest-coverage

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Jest coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-coverage-${{ matrix.node-version }}
          path: coverage/jest/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.node-version }}
          path: test-results/
          retention-days: 7

      - name: Comment PR with test results
        uses: daun/playwright-report-comment@v3
        if: github.event_name == 'pull_request' && matrix.node-version == '20.x'
        with:
          report-path: playwright-report

  coverage-check:
    name: Coverage Check
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: jest-coverage-20.x
          path: coverage/jest

      - name: Check coverage thresholds
        run: |
          echo "Coverage thresholds enforced by Jest config:"
          echo "- Lines: 70%"
          echo "- Functions: 70%"
          echo "- Branches: 70%"
          echo "- Statements: 70%"

      - name: Generate coverage summary
        run: |
          if [ -f coverage/jest/coverage-summary.json ]; then
            echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            cat coverage/jest/coverage-summary.json | \
              jq -r '.total |
                "| Lines | \(.lines.pct)% |",
                "| Statements | \(.statements.pct)% |",
                "| Functions | \(.functions.pct)% |",
                "| Branches | \(.branches.pct)% |"' >> $GITHUB_STEP_SUMMARY
          fi
